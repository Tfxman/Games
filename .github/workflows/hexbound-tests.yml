name: HEXBOUND engine tests

on:
  push:
    paths:
      - 'hexbound/**'
      - '.github/workflows/hexbound-tests.yml'
  pull_request:
    paths:
      - 'hexbound/**'
      - '.github/workflows/hexbound-tests.yml'
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine regression tests
        run: node --test hexbound/engine.test.js
