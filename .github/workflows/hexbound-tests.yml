name: HEXBOUND engine and UI tests

on:
  push:
    paths:
      - 'hexbound/**'
      - '.github/workflows/hexbound-tests.yml'
  pull_request:
    paths:
      - 'hexbound/**'
      - '.github/workflows/hexbound-tests.yml'
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine regression tests
        run: node --test hexbound/engine.test.js
      - name: Check engine JavaScript syntax
        run: node --check hexbound/engine.js
      - name: Check browser interface JavaScript syntax
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('hexbound/index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) throw new Error('Inline game script not found'); fs.writeFileSync('/tmp/hexbound-ui.js',scripts[scripts.length-1][1]);"
          node --check /tmp/hexbound-ui.js
